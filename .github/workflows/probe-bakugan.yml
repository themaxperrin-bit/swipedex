name: Probe BakuganDB

# Run it from the Actions tab ("Run workflow").
# Saves BakuganDB's pages (as the browser sees them) into the "bakugan/probe" folder so the Bakugan tab can be planned:
# the home page, the BakuDex, every series page, and the first pages each series links to.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -q xvfb >/dev/null
      - name: Save pages
        run: |
          mkdir -p bakugan/probe
          cat > probe.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const BASE = 'https://bakugandb.com';
          const PAGES = ['/bakudex', '/battle-brawlers', '/battle-planet', '/new-vestroia', '/gundalian-invaders', '/mechtanium-surge', '/bakutech',
                         '/armored-alliance', '/geogan-rising', '/evolutions', '/legends', '/generation-3'];
          const slug = u => (u.replace(BASE, '').replace(/^\/+|\/+$/g, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase() || 'home').slice(0, 120);
          (async () => {
            const browser = await chromium.launch({ headless: false, args: ['--disable-blink-features=AutomationControlled'] });
            const ctx = await browser.newContext({ viewport: { width: 1400, height: 1000 }, locale: 'en-US',
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36' });
            await ctx.addInitScript(() => Object.defineProperty(navigator, 'webdriver', { get: () => undefined }));
            const page = await ctx.newPage();
            const blocked = async () => /just a moment|attention required/i.test(await page.title().catch(() => ''));
            async function open(url) {
              for (let attempt = 1; attempt <= 5; attempt++) {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(() => {});
                for (let t = 0; t < 40 && await blocked(); t++) await page.waitForTimeout(1000);
                if (!await blocked()) { await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {}); return true; }
                console.log('  still blocked, attempt', attempt, url);
                await page.waitForTimeout(15000 * attempt);
              }
              return false;
            }
            const summary = [];
            for (const p of PAGES) {
              const ok = await open(BASE + p);
              for (let y = 0; y < 40; y++) { await page.evaluate(() => window.scrollBy(0, 1500)); await page.waitForTimeout(100); }
              fs.writeFileSync(`bakugan/probe/${slug(BASE + p)}.html`, await page.content());
              const info = await page.evaluate(() => ({ title: document.title,
                imgs: [...document.querySelectorAll('img')].map(i => i.getAttribute('src')),
                links: [...new Set([...document.querySelectorAll('a[href]')].map(a => a.getAttribute('href')))] }));
              console.log(p, ok ? 'OK' : 'BLOCKED', info.imgs.length, 'imgs', info.links.length, 'links');
              summary.push({ page: p, ok, title: info.title, imgs: info.imgs.length, links: info.links, sampleImgs: info.imgs.slice(0, 80) });
              await page.waitForTimeout(4000);
            }
            // can the photos be downloaded (with the browser's cookies)?
            const tests = [];
            for (const s of summary) for (const src of (s.sampleImgs || []).filter(x => x && !x.startsWith('data:')).slice(20, 22)) {
              const u = new URL(src, BASE).href;
              const r = await page.request.get(u).catch(e => null);
              tests.push({ u, status: r ? r.status() : 0, type: r ? r.headers()['content-type'] : '', bytes: r ? (await r.body()).length : 0 });
            }
            summary.push({ photoTests: tests });
            console.log(JSON.stringify(tests, null, 1));
            fs.writeFileSync('bakugan/probe/summary.json', JSON.stringify(summary, null, 1));
            await browser.close();
          })();
          JS
          xvfb-run -a node probe.js
          # the photo folders (static files) may not be behind the check: try one directly
          curl -s -o /dev/null -w 'photo status %{http_code}\n' 'https://bakugandb.com/Dex/01-%20BB/01-%20Dragonoid.jpg' || true
      - name: Save the results
        run: |
          git config user.name "swipedex-bot"
          git config user.email "swipedex-bot@users.noreply.github.com"
          git add bakugan
          git commit -m "Probe BakuganDB" || echo "No changes"
          git pull --rebase || true
          git push
