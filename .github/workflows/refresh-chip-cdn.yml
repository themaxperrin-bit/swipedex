name: Refresh chip CDN

# Runs by itself whenever pictures in "bitchips" change.
# Tells the jsDelivr CDN to drop its old copy, so the app shows the new chip right away.
on:
  push:
    paths:
      - "bitchips/**"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Clear changed chips from the CDN
        run: |
          files=$(git diff --name-only HEAD~1 HEAD -- bitchips 2>/dev/null || true)
          [ -z "$files" ] && files=$(ls bitchips/* )
          for f in $files; do
            curl -s -o /dev/null -w "%{http_code} $f\n" "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f"
          done
