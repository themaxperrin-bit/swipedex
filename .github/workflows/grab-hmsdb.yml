name: Grab HMSDB

# Run it from the Actions tab ("Run workflow").
# Reads HMSDB (https://www.hmsdb.com) with a real browser: every Beyblade page under Initial Releases,
# Gimmick Specialty Series, Rare Recolours and Launchers and Accessories, plus the part pages
# (Bit Protector / Attack Ring / Running Core variations, Weight Disks).
# Saves, in page order, the headings, text and photos of each page into the "hmsdb" folder:
#   hmsdb/photos/<page>/<n>.jpg   photos (max 1200px; Google's photo links expire, so copies are kept)
#   hmsdb/index.json              every page: its section, title, and its text and photos in order
# Safe to run again: pages already saved are skipped.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 sharp@0.33.5 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Read HMSDB
        run: |
          git config user.name "swipedex-bot"
          git config user.email "swipedex-bot@users.noreply.github.com"
          mkdir -p hmsdb/photos
          cat > grab.js <<'JS'
          const { chromium } = require('playwright');
          const sharp = require('sharp');
          const fs = require('fs');
          const { execSync } = require('child_process');
          const BASE = 'https://www.hmsdb.com';
          const SECTIONS = ['initial-releases', 'gimmick-specialty-series', 'rare-recolours', 'launchers-and-accessories',
                            'bit-protector-variations', 'attack-ring-variations', 'weight-disks', 'running-core-variations'];
          const INDEX = 'hmsdb/index.json';
          const index = fs.existsSync(INDEX) ? JSON.parse(fs.readFileSync(INDEX)) : { pages: [] };
          const done = new Set(index.pages.filter(p => p.items && p.items.length).map(p => p.url));
          const save = msg => { fs.writeFileSync(INDEX, JSON.stringify(index, null, 1));
            try { execSync(`git add -A hmsdb && git commit -q -m "${msg}" && git pull -q --rebase && git push -q`, { stdio: 'inherit' }); } catch (e) {} };
          const slug = u => u.replace(BASE, '').replace(/^\/+|\/+$/g, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase() || 'home';
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1400, height: 1000 } });
            async function load(url) {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 }).catch(() => {});
              for (let y = 0; y < 30; y++) { await page.evaluate(() => window.scrollBy(0, 900)); await page.waitForTimeout(250); }
              await page.waitForTimeout(1200);
            }
            // every page: the section page itself + the pages under it
            const queue = [];
            for (const sec of SECTIONS) {
              const url = `${BASE}/${sec}`;
              await load(url);
              const subs = await page.$$eval('a[href]', (as, sec) => [...new Set(as.map(a => a.href.split('#')[0].split('?')[0])
                .filter(h => h.includes('hmsdb.com/' + sec + '/')))], sec);
              console.log(sec, ':', subs.length, 'pages under it');
              queue.push({ url, section: sec, isSection: true }, ...subs.map(u => ({ url: u, section: sec })));
            }
            let n = 0;
            for (const q of queue) {
              if (done.has(q.url)) continue;
              await load(q.url);
              // headings, text and photos in page order (the site's menu, header and footer are skipped)
              const items = await page.evaluate(() => {
                const main = document.querySelector('[role="main"]') || document.body;
                const out = [];
                const walk = el => {
                  for (const c of el.children) {
                    if (c.closest('nav,header,footer,[role="navigation"],[role="banner"]')) continue;
                    if (c.tagName === 'IMG') {
                      const r = c.getBoundingClientRect();
                      if (r.width < 60 || r.height < 60) continue;
                      out.push({ type: 'photo', src: c.currentSrc || c.src, w: Math.round(r.width), h: Math.round(r.height), alt: c.alt || '' });
                    } else if (/^(H1|H2|H3|H4|H5|H6|P|LI)$/.test(c.tagName)) {
                      const t = c.innerText.replace(/\s+/g, ' ').trim();
                      if (t) out.push({ type: /^H/.test(c.tagName) ? 'heading' : 'text', tag: c.tagName.toLowerCase(), text: t.slice(0, 600) });
                      for (const im of c.querySelectorAll('img')) walk({ children: [im] });
                    } else walk(c);
                  }
                };
                walk(main);
                return out;
              });
              const title = await page.title();
              const key = slug(q.url);
              let k = 0;
              for (const it of items) {
                if (it.type !== 'photo') continue;
                if (/logo/i.test(it.alt) || it.src.includes('AMxu72tNiTYd94q1Ma3NtgTZ')) continue; // the site logo
                const src = it.src.replace(/=w\d+(-h\d+)?[^/]*$/, '=w1600');
                try {
                  const r = await page.request.get(src, { timeout: 60000 });
                  if (!r.ok()) { console.log('   photo status', r.status()); continue; }
                  const buf = await r.body();
                  const meta = await sharp(buf).metadata();
                  if ((meta.width || 0) < 150) continue;
                  k++;
                  const file = `${key}/${k}.jpg`;
                  fs.mkdirSync(`hmsdb/photos/${key}`, { recursive: true });
                  await sharp(buf).flatten({ background: '#ffffff' }).resize(1200, 1200, { fit: 'inside', withoutEnlargement: true })
                    .jpeg({ quality: 85, progressive: true }).toFile(`hmsdb/photos/${file}`);
                  it.file = file; it.size = [meta.width, meta.height];
                } catch (e) { console.log('   photo error', String(e).slice(0, 100)); }
              }
              const kept = items.filter(it => it.type !== 'photo' || it.file);
              index.pages = index.pages.filter(p => p.url !== q.url);
              index.pages.push({ url: q.url, section: q.section, isSection: !!q.isSection, title, key, items: kept });
              console.log(`${q.section} | ${title.slice(0, 50)} | ${k} photos, ${kept.length - k} text bits`);
              if (++n % 20 === 0) save(`HMSDB (${index.pages.length} pages)`);
            }
            save(`HMSDB (${index.pages.length} pages)`);
            await browser.close();
            console.log(`\nDone: ${index.pages.length} pages`);
          })();
          JS
          node grab.js

      - name: Save the results
        run: |
          git add -A hmsdb
          git commit -m "Grab HMSDB" || echo "No changes"
          git pull --rebase || true
          git push
