            rc-beyblades/rc-beyblade-l%C3%BC-bu-driger-v2
            rc-beyblades/rc-beyblade-zhao-yun-wolborg-4
          SLUGS
          python - <<'PY'
          import io, json, os, re, time, urllib.parse
          from PIL import Image
          from playwright.sync_api import sync_playwright

          os.makedirs("bey", exist_ok=True)

          def key(slug):
              return re.sub(r"[^A-Za-z0-9._-]", "_", urllib.parse.unquote(slug).lower())

          # Finds the Beyblade photo on the page: the first real photo, skipping the site logo.
          FIND = """() => {
            const ims = [...document.images].filter(i => {
              const s = i.currentSrc || i.src || "";
              return s.includes("googleusercontent.com") && !s.includes("=w16383")
                     && i.complete && i.naturalWidth >= 200 && i.naturalHeight >= 200;
            });
            if (!ims.length) return null;
            ims[0].scrollIntoView({block: "center"});
            return ims[0].currentSrc || ims[0].src;
          }"""

          def save(data, out):
              im = Image.open(io.BytesIO(data)).convert("RGB")
              im.thumbnail((1000, 1000))
              im.save(out, "JPEG", quality=88, optimize=True)

          slugs = [x.strip() for x in open("slugs.txt") if x.strip()]
          saved, missed = [], []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              ctx = browser.new_context(viewport={"width": 1280, "height": 1600}, device_scale_factor=2)
              page = ctx.new_page()
              photos = {}
              def grab(resp):
                  try:
                      if resp.request.resource_type == "image" and "googleusercontent.com" in resp.url:
                          photos[resp.url] = resp.body()
                  except Exception:
                      pass
              page.on("response", grab)

              for n, slug in enumerate(slugs, 1):
                  k = key(slug)
                  out = f"bey/{k}.jpg"
                  if os.path.exists(out) and os.path.getsize(out) > 1000:
                      saved.append(k); print(f"{n:3} HAVE", slug); continue
                  ok = False
                  for attempt in range(3):
                      try:
                          photos.clear()
                          page.goto("https://www.plasticsdb.com/beyblades/" + slug, wait_until="networkidle", timeout=60000)
                          src = None
                          for _ in range(10):  # give the photo up to 5 seconds to finish loading
                              src = page.evaluate(FIND)
                              if src: break
                              page.mouse.wheel(0, 600); page.wait_for_timeout(500)
                          if not src:
                              raise Exception("no photo on page")
                          page.wait_for_timeout(300)
                          data = photos.get(src)
                          if data and len(data) > 1000:
                              save(data, out)
                          else:  # fall back to a picture of the photo exactly as shown
                              page.locator(f'img[src="{src}"]').first.screenshot(path="shot.png")
                              save(open("shot.png", "rb").read(), out)
                          ok = True
                          break
                      except Exception as e:
                          print("    retry", slug, str(e)[:120])
                          time.sleep(3 * (attempt + 1))
                  (saved if ok else missed).append(k if ok else slug)
                  print(f"{n:3} {'OK  ' if ok else 'MISS'}", slug)
              browser.close()

          json.dump(sorted(saved), open("bey/index.json", "w"))
          print(f"\nSaved {len(saved)} of {len(slugs)} photos. Missed: {missed}")
          PY
          rm -f slugs.txt shot.png

      - name: Store the photos in this repository
        run: |
          git config user.name "swipedex-bot"
          git config user.email "swipedex-bot@users.noreply.github.com"
          git add bey
          git commit -m "Update Beyblade photos" || echo "No changes"
          git push
