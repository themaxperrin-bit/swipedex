            rc-beyblades/rc-beyblade-guan-yu-dragoon-v2
            rc-beyblades/rc-beyblade-l%C3%BC-bu-driger-v2
            rc-beyblades/rc-beyblade-zhao-yun-wolborg-4
          SLUGS
          python - <<'PY'
          import io, json, os, re, time, urllib.parse
          import requests
          from PIL import Image

          UA = "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140 Mobile Safari/537.36"
          s = requests.Session()
          s.headers["User-Agent"] = UA
          os.makedirs("bey", exist_ok=True)
          IMG = re.compile(r"https://lh\d-[a-z]+\.googleusercontent\.com/sitesv-images[^\"'\s)\\<>]+")

          def key(slug):
              return re.sub(r"[^A-Za-z0-9._-]", "_", urllib.parse.unquote(slug).lower())

          def photo_url(html):
              for m in IMG.finditer(html):
                  u = m.group(0).replace("&amp;", "&")
                  if "=w16383" in u:  # site logo
                      continue
                  return re.sub(r"=[wsh]\d+[^\"'\s]*$", "", u) + "=w1280"
              return None

          slugs = [x.strip() for x in open("slugs.txt") if x.strip()]
          saved, failed = [], []
          for slug in slugs:
              out = f"bey/{key(slug)}.jpg"
              if os.path.exists(out) and os.path.getsize(out) > 1000:
                  saved.append(key(slug)); continue
              ok = False
              for attempt in range(3):
                  try:
                      page = s.get("https://www.plasticsdb.com/beyblades/" + slug, timeout=30)
                      page.raise_for_status()
                      url = photo_url(page.text)
                      if not url:
                          break  # this page has no photo
                      img = s.get(url, timeout=60, headers={"Referer": "https://www.plasticsdb.com/"})
                      img.raise_for_status()
                      im = Image.open(io.BytesIO(img.content)).convert("RGB")
                      im.thumbnail((1000, 1000))
                      im.save(out, "JPEG", quality=88, optimize=True)
                      ok = True
                      break
                  except Exception as e:
                      print("retry", slug, e)
                      time.sleep(3 * (attempt + 1))
              (saved if ok else failed).append(key(slug) if ok else slug)
              print("OK  " if ok else "MISS", slug)
              time.sleep(1)

          json.dump(sorted(saved), open("bey/index.json", "w"))
          print(f"\nSaved {len(saved)} photos, missed {len(failed)}:", failed)
          PY
          rm slugs.txt

      - name: Store the photos in this repository
        run: |
          git config user.name "swipedex-bot"
          git config user.email "swipedex-bot@users.noreply.github.com"
          git add bey
          git commit -m "Update Beyblade photos" || echo "No changes"
          git push
