name: Save Beyblade photos

# Run it from the Actions tab ("Run workflow"). It also re-checks once a month for new Beyblades.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install helpers
        run: pip install requests pillow

