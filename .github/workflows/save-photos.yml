name: Save Beyblade photos

# Run it from the Actions tab ("Run workflow"). It also re-checks once a month for new Beyblades.
# Opens each PlasticsDB page in a real (hidden) Chrome browser and keeps the photo that page shows,
# because Google refuses photo requests that don't come from a real browser.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

concurrency:
  group: save-photos
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a hidden Chrome browser
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

