            driger-g-hasbro-metallic-black-ver
            dranzer-g-hasbro-metallic-red-ver
            draciel-g-hasbro-metallic-dark-turqoise-ver
            metal-driger-hasbro-metallic-dark-green-ver
            rc-beyblades/rc-beyblade-draciel-v2
            rc-beyblades/rc-beyblade-dragoon-g
            rc-beyblades/rc-beyblade-dragoon-v2
            rc-beyblades/rc-beyblade-dranzer-v2
            rc-beyblades/rc-beyblade-driger-v2
            rc-beyblades/rc-beyblade-gaia-dragoon-v
            rc-beyblades/rc-beyblade-wolborg-4
            rc-beyblades/driger-g-hasbro-engine-gear-rc
            rc-beyblades/draciel-g-hasbro-engine-gear-rc
            rc-beyblades/rc-beyblade-cao-cao-draciel-v2
            rc-beyblades/rc-beyblade-guan-yu-dragoon-v2
            rc-beyblades/rc-beyblade-l%C3%BC-bu-driger-v2
            rc-beyblades/rc-beyblade-zhao-yun-wolborg-4
          SLUGS
          python -u - <<'PY'
          import io, json, os, re, time, urllib.parse
          from PIL import Image
          from playwright.sync_api import sync_playwright

          os.makedirs("parts", exist_ok=True)
          SITE = "https://www.plasticsdb.com/"
          TYPES = {"bit-chips": "Bit Chip", "attack-rings": "Attack Ring", "weight-disks": "Weight Disk",
                   "spin-gears": "Spin Gear", "support-parts": "Support Part", "blade-bases": "Blade Base",
                   "misc-parts": "Misc. Part"}

          def key(path):
              return re.sub(r"[^A-Za-z0-9._-]", "_", urllib.parse.unquote(path).lower())

          # The part links in the page's main content (not the site menu), in page order.
          # The Beyblade's own parts are the section headings like "Attack Ring: Reverse Dragon".
          # (Links inside the write-ups mention other parts, so those are ignored.)
          PARTS = """() => {
            const out = [];
            for (const h of document.querySelectorAll('h1,h2,h3,h4,h5,h6,[role="heading"]')) {
              const text = (h.innerText || h.textContent || '').trim();
              const m = text.match(/^([^:]{2,40}):/);
              if (!m) continue;
              for (const a of h.querySelectorAll('a[href]')) {
                let path = null;
                try {
                  let u = new URL(a.getAttribute('href'), location.href);
                  if (u.hostname.endsWith('google.com') && u.searchParams.get('q')) { try { u = new URL(u.searchParams.get('q')); } catch (e) {} }
                  const segs = u.pathname.split('/').filter(Boolean), i = segs.indexOf('parts');
                  if (i >= 0 && segs.length - i >= 3) path = segs.slice(i + 1).join('/');
                } catch (e) {}
                out.push({label: m[1].trim(), name: (a.innerText || a.textContent || '').trim(), path});
              }
            }
            return out;
          }"""

          FIND = """() => {
            const ims = [...document.images].filter(i => {
              const s = i.currentSrc || i.src || "";
              return s.includes("googleusercontent.com") && !s.includes("=w16383")
                     && i.complete && i.naturalWidth >= 150 && i.naturalHeight >= 150;
            });
            if (!ims.length) return null;
            ims[0].scrollIntoView({block: "center"});
            return ims[0].currentSrc || ims[0].src;
          }"""

          def save(data, out):
              im = Image.open(io.BytesIO(data)).convert("RGB")
              im.thumbnail((800, 800))
              im.save(out, "JPEG", quality=86, optimize=True)

          slugs = [x.strip() for x in open("slugs.txt") if x.strip()]
          index, all_parts = {}, {}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              ctx = browser.new_context(viewport={"width": 1280, "height": 1600}, device_scale_factor=2)
              page = ctx.new_page()
              photos = {}
              def grab(resp):
                  try:
                      if resp.request.resource_type == "image" and "googleusercontent.com" in resp.url:
                          photos[resp.url] = resp.body()
                  except Exception:
                      pass
              page.on("response", grab)

              def open_page(url):
                  for attempt in range(3):
                      try:
                          photos.clear()
                          r = page.goto(url, wait_until="networkidle", timeout=60000)
                          if r and r.status == 404:
                              print("    no such page", url); return False
                          return True
                      except Exception as e:
                          print("    retry", url, str(e)[:100]); time.sleep(3 * (attempt + 1))
                  return False

              # 0) links that are in the site menu on every page (taken from a page with no parts)
              def category(label):
                  l = label.lower()
                  if "bit" in l: return "bit-chips"
                  if "attack" in l or "ring" in l: return "attack-rings"
                  if "weight" in l or "disk" in l: return "weight-disks"
                  if "support" in l: return "support-parts"
                  if any(w in l for w in ("spin gear", "core", "shell", "tip", "cew", "engine", "shaft", "sg")): return "spin-gears"
                  if "base" in l: return "blade-bases"
                  return "misc-parts"

              def slug(name):
                  return re.sub(r"-+", "-", re.sub(r"[^a-z0-9]+", "-", name.lower())).strip("-")

              # 1) each Beyblade's parts list
              for n, slug in enumerate(slugs, 1):
                  bkey = key(slug)
                  found = []
                  if open_page(SITE + "beyblades/" + slug):
                      found = page.evaluate(PARTS)
                  lst = []
                  seen = set()
                  for f in found:
                      name = f["name"] or (f["path"] or "").split("/")[-1].replace("-", " ").title()
                      if not name: continue
                      # editor links don't include the public address, so build it from the heading and name
                      path = f["path"] or (category(f["label"]) + "/" + slug(name))
                      if path in seen: continue
                      seen.add(path)
                      cat = path.split("/")[0]
                      k = key(path)
                      f["path"] = path
                      lst.append({"name": name, "type": TYPES.get(cat, cat.replace("-", " ").title()), "key": k, "path": f["path"]})
                      all_parts[k] = f["path"]
                  index[bkey] = lst
                  print(f"{n:3} {slug}: " + ", ".join(f"{x['type']}={x['name']}" for x in lst))

              print(f"\n{len(all_parts)} different parts. Saving their photos...\n")

              # 2) one photo per part
              missed = []
              for n, (k, path) in enumerate(sorted(all_parts.items()), 1):
                  out = f"parts/{k}.jpg"
                  if os.path.exists(out) and os.path.getsize(out) > 1000:
                      print(f"{n:3} HAVE", path); continue
                  ok = False
                  if open_page(SITE + "parts/" + path):
                      try:
                          src = None
                          for _ in range(10):
                              src = page.evaluate(FIND)
                              if src: break
                              page.mouse.wheel(0, 600); page.wait_for_timeout(500)
                          if src:
                              page.wait_for_timeout(300)
                              data = photos.get(src)
                              if data and len(data) > 1000:
                                  save(data, out)
                              else:
                                  page.locator(f'img[src="{src}"]').first.screenshot(path="shot.png")
                                  save(open("shot.png", "rb").read(), out)
                              ok = True
                      except Exception as e:
                          print("    error", path, str(e)[:100])
                  if not ok: missed.append(k)
                  print(f"{n:3} {'OK  ' if ok else 'MISS'}", path)
              browser.close()
          for lst in index.values():
              for x in lst: x["photo"] = x["key"] not in missed
          json.dump(index, open("parts/index.json", "w"), indent=1)
          print(f"\nDone. Missed photos: {missed}")
          PY
          rm -f slugs.txt shot.png

      - name: Store the parts in this repository
        run: |
          git config user.name "swipedex-bot"
          git config user.email "swipedex-bot@users.noreply.github.com"
          git add parts
          git commit -m "Update Beyblade parts" || echo "No changes"
          git pull --rebase || true
          git push
