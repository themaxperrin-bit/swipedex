name: Save Beyblade parts

# Run it from the Actions tab ("Run workflow"). It re-checks once a month too.
# Reads each Beyblade's PlasticsDB page to find its parts, then saves a photo of every part.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 1 * *"

permissions:
  contents: write

concurrency:
  group: save-parts
  cancel-in-progress: true

jobs:
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a hidden Chrome browser
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Find every Beyblade's parts and save their photos
