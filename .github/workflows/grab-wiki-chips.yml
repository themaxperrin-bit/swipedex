name: Grab wiki bit chips

# Run it from the Actions tab ("Run workflow").
# Saves every picture from the Beyblade Wiki's bit chip pages (Category:Bit_Chips)
# into the "wiki-chips" folder, plus sharpened copies in "wiki-chips-hd".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the upscaler
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 unzip
          curl -sSL -o esr.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          mkdir -p /tmp/esr && unzip -q -o esr.zip -d /tmp/esr && chmod +x /tmp/esr/realesrgan-ncnn-vulkan

      - name: Save every bit chip picture from the wiki
        run: |
          pip install requests pillow >/dev/null
          python -u - <<'PY'
          import io, json, os, re, subprocess, time
          import requests
          from PIL import Image

          API = "https://beyblade.fandom.com/api.php"
          s = requests.Session()
          s.headers["User-Agent"] = "SwipeDexBot/1.0 (personal collection app; https://github.com/themaxperrin-bit/swipedex)"
          os.makedirs("wiki-chips", exist_ok=True); os.makedirs("wiki-chips-hd", exist_ok=True)
          esr = "/tmp/esr/realesrgan-ncnn-vulkan"
          print("Upscaler available:", os.path.exists(esr))

          def api(**params):
              params.update(format="json", formatversion="2")
              for attempt in range(4):
                  try:
                      r = s.get(API, params=params, timeout=60)
                      if r.status_code == 200: return r.json()
                      print("    api status", r.status_code)
                  except Exception as e:
                      print("    api error", str(e)[:100])
                  time.sleep(5 * (attempt + 1))
              raise SystemExit("The wiki's API isn't answering")

          def key(t):
              return re.sub(r"-+", "-", re.sub(r"[^a-z0-9]+", "-", t.lower())).strip("-")

          def enhance(src_png, out_png):
              im = Image.open(src_png).convert("RGBA")
              if max(im.size) < 1000 and os.path.exists(esr):
                  r = subprocess.run([esr, "-i", src_png, "-o", "/tmp/up.png", "-n", "realesrgan-x4plus-anime", "-s", "4", "-m", "/tmp/esr/models"],
                                     capture_output=True, text=True, timeout=900)
                  if r.returncode == 0 and os.path.exists("/tmp/up.png"):
                      up = Image.open("/tmp/up.png").convert("RGBA")
                      up.putalpha(im.getchannel("A").resize(up.size, Image.LANCZOS))
                      if max(up.size) > 1400: up.thumbnail((1400, 1400), Image.LANCZOS)
                      up.save(out_png, "PNG", optimize=True); os.remove("/tmp/up.png")
                      return "AI x4"
                  print("    upscaler failed:", (r.stderr or r.stdout)[-200:])
              if max(im.size) < 1000:
                  f = 1000 / max(im.size); im = im.resize((round(im.width * f), round(im.height * f)), Image.LANCZOS)
              im.save(out_png, "PNG", optimize=True)
              return "smooth"

          # 1) every page in the Bit Chips category
          titles, cont = [], {}
          while True:
              d = api(action="query", list="categorymembers", cmtitle="Category:Bit_Chips", cmlimit="500", cmtype="page", **cont)
              titles += [m["title"] for m in d["query"]["categorymembers"]]
              if "continue" not in d: break
              cont = d["continue"]; time.sleep(1)
          print(f"Found {len(titles)} bit chip pages" + chr(10))

          # 2) every picture on each page, at full size
          index = []
          for n, title in enumerate(titles, 1):
              d = api(action="query", generator="images", titles=title, gimlimit="500", prop="imageinfo", iiprop="url|size|mime")
              files = (d.get("query") or {}).get("pages") or []
              pk = key(title.replace("Bit Chip - ", ""))
              os.makedirs(f"wiki-chips/{pk}", exist_ok=True); os.makedirs(f"wiki-chips-hd/{pk}", exist_ok=True)
              saved = []
              for f in sorted(files, key=lambda x: x.get("title", "")):
                  info = (f.get("imageinfo") or [{}])[0]
                  url, w, h = info.get("url"), info.get("width", 0), info.get("height", 0)
                  if not url or "image" not in info.get("mime", "image") or max(w, h) < 60: continue
                  name = key(re.sub(r"\.[a-z0-9]+$", "", f["title"].replace("File:", "")))
                  raw, hd = f"wiki-chips/{pk}/{name}.png", f"wiki-chips-hd/{pk}/{name}.png"
                  try:
                      if not os.path.exists(raw):
                          r = s.get(url, timeout=60, headers={"Referer": "https://beyblade.fandom.com/"})
                          if r.status_code != 200: print("    picture status", r.status_code, url); continue
                          Image.open(io.BytesIO(r.content)).convert("RGBA").save(raw, "PNG", optimize=True)
                          time.sleep(0.5)
                      how = enhance(raw, hd) if not os.path.exists(hd) else "had"
                      saved.append({"file": f"{pk}/{name}.png", "wiki_name": f["title"], "size": [w, h]})
                      print(f"    {w}x{h} {how}  {f['title']}")
                  except Exception as e:
                      print("    picture error", f.get("title"), str(e)[:100])
              index.append({"title": title, "key": pk, "images": saved})
              print(f"{n:3} {title}: {len(saved)} pictures")
              time.sleep(1)

          json.dump(index, open("wiki-chips/index.json", "w"), indent=1)
          print(chr(10) + f"Done: {len(index)} pages, {sum(len(x['images']) for x in index)} pictures")
          PY

      - name: Save the results
        run: |
          git config user.name "swipedex-bot"
          git config user.email "swipedex-bot@users.noreply.github.com"
          git add wiki-chips wiki-chips-hd
          git commit -m "Grab wiki bit chips" || echo "No changes"
          git pull --rebase || true
          git push
