": "strata-dragoon"}, {"section": "Beyblade: G-Revolution", "name": "Metal Driger", "files": ["Metal Driger.png"], "owner": "Jin of The Gale", "beyblades": ["Metal Driger"], "slug": "metal-driger"}, {"section": "Beyblade: G-Revolution", "name": "Rock Bison", "files": ["RockBison.png"], "owner": "Rick Anderson", "beyblades": ["Rock Bison"], "slug": "rock-bison"}, {"section": "Beyblade: G-Revolution", "name": "Torch Pegasus", "files": ["TorchPegasus.02.jpg"], "owner": "Raul Fernandez", "beyblades": ["Torch Pegasus"], "slug": "torch-pegasus"}, {"section": "Beyblade: G-Revolution", "name": "Thunder Pegasus", "files": ["TP-BB.png"], "owner": "Julia Fernandez", "beyblades": ["Thunder Pegasus"], "slug": "thunder-pegasus"}, {"section": "Beyblade: G-Revolution", "name": "Dark Gargoyle", "files": ["Death Gargoyle.png"], "owner": "Miguel", "beyblades": ["Dark Gargoyle"], "slug": "dark-gargoyle"}, {"section": "Beyblade: G-Revolution", "name": "Rapid Eagle", "files": ["Rapideagle .png"], "owner": "Claude", "beyblades": ["Rapid Eagle"], "slug": "rapid-eagle"}, {"section": "Beyblade: G-Revolution", "name": "Rushing Boar", "files": ["Rushing Boar.png"], "owner": "Aaron", "beyblades": ["Rushing Boar"], "slug": "rushing-boar"}, {"section": "Beyblade: G-Revolution", "name": "Pierce Hedgehog", "files": ["Pierce Hedgehog.png"], "owner": "Mathilda", "beyblades": ["Pierce Hedgehog"], "slug": "pierce-hedgehog"}, {"section": "Beyblade: G-Revolution", "name": "Venus", "files": ["Venus1.png"], "owner": "Ming-Ming", "beyblades": ["Venus"], "slug": "venus"}, {"section": "Beyblade: G-Revolution", "name": "Gigars", "files": ["Gigars.png"], "owner": "Crusher", "beyblades": ["Gigars"], "slug": "gigars"}, {"section": "Beyblade: G-Revolution", "name": "Apollon", "files": ["ApollonBeast.png"], "owner": "Garland Siebald", "beyblades": ["Apollon"], "slug": "apollon"}, {"section": "Beyblade: G-Revolution", "name": "Poseidon", "files": ["Posideon.png"], "owner": "Mystel", "beyblades": ["Poseidon"], "slug": "poseidon"}, {"section": "Beyblade: G-Revolution", "name": "Zeus", "files": ["Zues.png"], "owner": "Brooklyn", "beyblades": ["Zeus"], "slug": "zeus"}, {"section": "Beyblade: The Movie - Fierce Battle", "name": "Dark Dragoon", "files": ["Darkdragoon.jpg"], "owner": "Henry", "beyblades": ["Dark Dragoon"], "slug": "dark-dragoon"}, {"section": "Beyblade: The Movie - Fierce Battle", "name": "Dark Dranzer", "files": ["DarkDranzerBeast.png"], "owner": "Ashley", "beyblades": ["Dark Dranzer"], "slug": "dark-dranzer"}, {"section": "Beyblade: The Movie - Fierce Battle", "name": "Dark Draciel", "files": ["DarkDracielBeast.png"], "owner": "Steven", "beyblades": ["Dark Draciel"], "slug": "dark-draciel"}, {"section": "Beyblade: The Movie - Fierce Battle", "name": "Dark Driger", "files": ["DarkDrigerBeast.png"], "owner": "Daniel", "beyblades": ["Dark Driger"], "slug": "dark-driger"}, {"section": "Video Games", "name": "Pegasion", "files": ["Pegasion.png"], "owner": "Kaoru Amou", "beyblades": ["Wing Breaker", "Altios", "Altios C"], "slug": "pegasion"}, {"section": "Video Games", "name": "Vulpes", "files": ["Ullpace.png"], "owner": "Makoto Amou", "beyblades": ["Beygrap"], "slug": "vulpes"}, {"section": "Video Games", "name": "Agrios", "files": ["Agurios.png"], "owner": "Shougo Namba", "beyblades": ["Agrios"], "slug": "agrios"}, {"section": "Video Games", "name": "Grand Crone", "files": ["GrandCrone.png"], "owner": "Haruka Chizan", "beyblades": ["Grand Crow"], "slug": "grand-crone"}]
          JSON
          python -u - <<'PY'
          import io, json, os, re, shutil, time
          import requests
          from PIL import Image
          API = "https://beyblade.fandom.com/api.php"
          s = requests.Session()
          s.headers["User-Agent"] = "SwipeDexBot/1.0 (personal collection app; https://github.com/themaxperrin-bit/swipedex)"
          OUT = "spirits/og"
          for d in os.listdir(OUT):
              if os.path.isdir(f"{OUT}/{d}"): shutil.rmtree(f"{OUT}/{d}")
          beasts = json.load(open("beasts.json"))
          def api(**p):
              p.update(format="json", formatversion="2")
              for a in range(5):
                  try:
                      r = s.get(API, params=p, timeout=60)
                      if r.status_code == 200: return r.json()
                  except Exception as e: print("  api error", str(e)[:80])
                  time.sleep(5 * (a + 1))
              raise SystemExit("The wiki isn't answering, run the job again later")
          made = failed = 0
          for b in beasts:
              b["pictures"] = []
              for fn in b["files"]:
                  d = api(action="query", titles="File:" + fn, prop="imageinfo", iiprop="url")
                  ii = d["query"]["pages"][0].get("imageinfo")
                  if not ii: print("  not on the wiki:", fn); failed += 1; continue
                  try:
                      r = s.get(ii[0]["url"], timeout=60); r.raise_for_status()
                      im = Image.open(io.BytesIO(r.content)); im.seek(0); im = im.convert("RGBA")
                      bg = Image.new("RGB", im.size, (0, 0, 0)); bg.paste(im, mask=im.split()[3]); bg.thumbnail((1000, 1000))
                      out = f"{OUT}/{b['slug']}/{len(b['pictures']) + 1}.jpg"
                      os.makedirs(os.path.dirname(out), exist_ok=True)
                      bg.save(out, "JPEG", quality=88, optimize=True, progressive=True)
                      b["pictures"].append(out.replace("spirits/", "")); made += 1
                  except Exception as e: print("  picture error", fn, str(e)[:80]); failed += 1
                  time.sleep(0.4)
              print(f"{b['name']:28s} {len(b['pictures'])} -> {', '.join(b['beyblades'])[:70]}")
          json.dump({"source": "https://beyblade.fandom.com/wiki/List_of_Bit_Beasts", "beasts": beasts},
                    open(f"{OUT}/index.json", "w"), indent=1, ensure_ascii=False)
          print(f"Done: {len(beasts)} bit-beasts, {made} pictures, {failed} failed")
          PY
      - name: Save the results
        run: |
          git config user.name "swipedex-bot"
          git config user.email "swipedex-bot@users.noreply.github.com"
          git add -A spirits
          git commit -m "Fix OG bit-beasts" || echo "No changes"
          git pull --rebase || true
          git push
