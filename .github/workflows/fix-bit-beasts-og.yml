name: Fix OG bit-beasts

# Run it from the Actions tab ("Run workflow").
# Reads the Beyblade Wiki's "List of Bit Beasts" (https://beyblade.fandom.com/wiki/List_of_Bit_Beasts):
# every original-series bit-beast, its owner, which Beyblades it lives in, and its picture.
# Saves:
#   spirits/og/<bit-beast>/1.jpg, 2.jpg ...   picture from the list first, then the bit-beast's own wiki page
#   spirits/og/index.json                    name, section, owner, Beyblades, pictures
#   spirits/og/list.wikitext                 the list page itself, for checking
# Downloads exactly the bit-beast pictures named in the list (replaces the first run's pictures).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save the bit-beast pictures
        run: |
          pip install requests pillow >/dev/null
          cat > beasts.json <<'JSON'
