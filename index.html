<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SwipeDex</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#f0f6fc;--muted:#8b949e;--accent:#ffcc00}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0d1117,#111827);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.app{max-width:520px;margin:auto;padding:18px 14px 30px}
.gameTabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px}.gameTabs .gameTab{padding-left:2px;padding-right:2px;font-size:clamp(10px,3.1vw,14px);white-space:nowrap}
.gameTab{background:#21262d;color:var(--muted);border:1px solid var(--line)}
.gameTab.active{background:var(--accent);color:#111;border-color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
h1{font-size:26px;margin:0}
.badge{font-size:12px;color:#111;background:var(--accent);padding:7px 10px;border:0;border-radius:999px;font-weight:900}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.toggle{border:1px solid var(--line);background:#161b22;color:var(--muted);border-radius:13px;padding:10px 8px;font-size:13px;font-weight:900}
.toggle.on{background:var(--accent);color:#111;border-color:var(--accent)}
.searchWrap{position:relative}.search{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:#0d1117;color:white;font-size:16px;outline:none;margin-bottom:14px}
.suggestions{display:none;position:absolute;z-index:20;left:0;right:0;top:52px;max-height:330px;overflow:auto;background:#161b22;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 35px #000a}
.suggestions.show{display:block}
.suggestion{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.suggestion:last-child{border-bottom:0}
.suggestion b{display:block;font-size:15px}.suggestion span{color:var(--muted);font-size:12px}
.card{background:rgba(22,27,34,.96);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 18px 45px #0007;touch-action:pan-y;user-select:none}
.number{color:var(--muted);font-weight:800;letter-spacing:.08em}
.name{font-size:34px;font-weight:900;margin:3px 0 8px;text-transform:capitalize;min-height:42px}
.types{min-height:8px}
.art{height:310px;display:flex;align-items:center;justify-content:center}
.art img{max-width:100%;max-height:290px;filter:drop-shadow(0 18px 15px #0008)}
.actions{display:grid;grid-template-columns:52px 1fr 52px;gap:9px;margin-top:14px}
button{border:0;border-radius:14px;padding:13px;background:#21262d;color:white;font-size:17px;font-weight:800;cursor:pointer}
.download{background:var(--accent);color:#111}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
.status{text-align:center;color:#ffb4b4;font-size:12px;min-height:18px;margin-top:6px}
.count{text-align:center;color:var(--muted);font-size:11px;margin-top:5px}

#beyName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;min-height:0;height:1.2em}
#ygoName{white-space:nowrap;overflow:hidden;text-overflow:clip;min-height:1.25em;line-height:1.15}

.jumpCounter{display:inline-flex;align-items:center;gap:5px}
.jumpInput{width:62px;min-height:34px;padding:4px 6px;text-align:center;font:inherit;font-weight:700;color:inherit;background:#161b22;border:1px solid var(--line);border-radius:8px;box-sizing:border-box}
.jumpGo{min-height:34px;padding:4px 9px;border-radius:8px}

#ygoCategoryButtons{
  display:grid;
  grid-template-columns:.72fr 1.45fr 1fr .85fr;
  gap:0;
  width:100%;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:#151a20;
}
#ygoCategoryButtons button{
  min-width:0;
  width:100%;
  min-height:54px;
  padding:8px 4px;
  margin:0;
  border:0;
  border-right:1px solid var(--line);
  border-radius:0;
  background:transparent;
  color:#9ca3af;
  font:inherit;
  font-weight:800;
  font-size:clamp(12px,3.5vw,17px);
  white-space:nowrap;
}
#ygoCategoryButtons button:last-child{border-right:0}
#ygoCategoryButtons button.on{
  background:#ffca05;
  color:#151515;
}

.beyShow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}.beyShow button{height:34px;padding:0 4px;white-space:nowrap;overflow:hidden;border-radius:999px;border:1px solid var(--line);background:#151a20;color:#8f96a3;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.beyShow button::before{content:'☐ ';}.beyShow button[aria-pressed="true"]{background:#ffca05;border-color:#ffca05;color:#111}.beyShow button[aria-pressed="true"]::before{content:'✓ ';}.beyShow button:focus-visible{outline:2px solid #ffca05;outline-offset:2px}
.beyControls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.beyControls .beySortWide{grid-column:1/-1}
.ygoCompactControls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ygoSelectWrap{display:flex;align-items:center;min-width:0;height:54px;border:1px solid var(--line);border-radius:16px;background:#151a20;overflow:hidden}
.ygoSelectWrap span{padding-left:14px;font-size:12px;font-weight:800;color:#8f96a3}
.ygoSelectWrap select{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#ffca05;font:inherit;font-weight:900;text-align:right;padding:0 12px}
.ygoCompactControls #ygoAltArts{grid-column:1/-1;width:100%}

.vgControls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.vgControls .ygoSelectWrap{height:48px}.vgWide{grid-column:1/-1;height:44px}
#vgName{white-space:nowrap;overflow:hidden;text-overflow:clip;text-transform:none}
.vgInfo{color:var(--muted);font-size:13px;font-weight:700;text-align:center;margin-top:6px;line-height:1.45}
#vgArtBox.cropped{position:relative;overflow:hidden;border-radius:14px;height:auto;aspect-ratio:4/3;display:block;max-width:360px;margin:0 auto}
#vgArtBox.cropped img{position:absolute;max-width:none;max-height:none;filter:none}
.vgShow{grid-template-columns:repeat(3,minmax(0,1fr))}.vgAltBtn{height:48px;margin:0}
.vgNote{color:#ffca05;font-size:12px;font-weight:800;text-align:center;margin-top:6px}.vgNote:empty{display:none}
.ygoCategorySelect,.ygoSubtypeSelect{width:100%;margin:0}.ygoSubtypeSelect{margin-top:10px}
</style>
<!-- RECOVERY BUILD: exact known-good verified-image version; selector/render logic untouched -->
</head>

</div>
</div>

function baseFamilyName(name){
 return name.replace(/^Shiny\s+/i,"")
   .replace(/^(Mega|Giga|Gigantamax|Alolan|Galarian|Hisuian|Paldean)\s+/i,"")
   .trim();
}
const FORM_ALIASES={
 "crystal onix":95,
 "crystal onyx":95
};
function matchSpecies(name){
 const raw=baseFamilyName(name).toLowerCase();
 const alias=FORM_ALIASES[raw.trim()];
 if(alias) return alias;
 const cleaned=norm(raw);
 let best=null;
 for(const c of canonicalList){
   const species=c.name.toLowerCase();
   const key=norm(species);
   if(!key) continue;
   // Match the species anywhere in a custom-form name, not only at the start.
   // This catches names such as "Crystal Onix", "Armored Mewtwo", etc.
   const words=raw.split(/[^a-z0-9]+/).filter(Boolean);
   const speciesWords=species.split(/[^a-z0-9]+/).filter(Boolean);
   const wordMatch=speciesWords.length===1 && words.includes(speciesWords[0]);
   const phraseMatch=cleaned===key || cleaned.startsWith(key) || cleaned.endsWith(key) || cleaned.includes(key);
   if((wordMatch || phraseMatch) && (!best || key.length>norm(best.name).length)) best=c;
 }
 return best ? best.id : 0;
}

   const start=(bucket-1)*size;
   list=unmatched.slice(start,start+size)
     .filter(p=>showShiny || !/^Shiny\s/i.test(p.name))
     .map(p=>({...p,baseId:p.id,form:true}));
 }else{
   const g=Number(generation),[start,end]=GEN_RANGES[g];
   const bySpecies=new Map();

     for(const p of customCatalog){
       const baseId=matchSpecies(p.name);
       if(baseId<start || baseId>end)continue;
       if(!showShiny && /^Shiny\s/i.test(p.name))continue;
       if(!bySpecies.has(baseId))bySpecies.set(baseId,[]);

     }
   }
   for(let id=start;id<=end;id++){
     const name=canonicalNames[id]||`Pokémon #${id}`;

 }

 const formCounts={};

  if(pokePending&&!reset){

function move(d){

   const order=["1","2","3","4","5","6","7","8","9","c1"];
   const pos=order.indexOf(String(generation));
   if(pos<order.length-1){
     generation=order[pos+1];
     $("genSelect").value=generation;
     $("search").value="";

   }

   const order=["1","2","3","4","5","6","7","8","9","c1"];

function allSearchEntries(){

 const out=[];

   const [start,end]=GEN_RANGES[g];
   for(let id=start;id<=end;id++){
     const name=canonicalNames[id]||`Pokémon #${id}`;
     out.push({id,baseId:id,name,section:String(g),label:`Gen ${g}`});
     if(showShiny) out.push({id:id+2000,baseId:id,name:`Shiny ${name}`,section:String(g),label:`Gen ${g}`});
   }
 }
 if(showForms){
   for(const p of customCatalog){
     const baseId=matchSpecies(p.name);
     if(baseId){
       if(!showShiny && /^Shiny\s/i.test(p.name))continue;
       const g=genForBase(baseId);
       if(g)out.push({...p,baseId,section:String(g),label:`Gen ${g}`});
     }else{
       if(!showShiny && /^Shiny\s/i.test(p.name))continue;
       out.push({...p,baseId:p.id,section:"c1",label:"Fusions"});
     }
   }

}

let ygoCards=[],ygoEntries=[],ygoFiltered=[],ygoIndex=0,ygoMode="card",ygoSort="release",ygoAltArts=false,ygoLoaded=false;

function ygoKind(c){
 const t=(c.type||"").toLowerCase();
 if(t.includes("spell"))return "SPELL";
 if(t.includes("trap"))return "TRAP";
 return "MONSTER";
}
function firstSetCode(c){return (c.card_sets&&c.card_sets.length)?c.card_sets[0].set_code:"NO SET CODE";}
function firstSetName(c){return (c.card_sets&&c.card_sets.length)?c.card_sets[0].set_name:"Set unknown";}
function makeYgoEntries(){
 const out=[];
 for(const c of ygoCards){
   const imgs=c.card_images||[];
   if(!imgs.length)continue;
   const count=ygoAltArts?imgs.length:1;
   for(let ai=0;ai<count;ai++)out.push({card:c,artIndex:ai,isAlt:ai>0});
 }
 return out;
}
function currentYgoKey(){
 const e=ygoFiltered[ygoIndex];
 return e?`${e.card.id}:${e.artIndex}`:null;
}
async function loadYgo(){
 if(ygoLoaded)return;
 $("ygoStatus").textContent="Loading card database…";
 try{
   const r=await fetch("https://db.ygoprodeck.com/api/v7/cardinfo.php?misc=yes");
   if(!r.ok)throw new Error("API "+r.status);
   const d=await r.json();
   ygoCards=d.data||[];
   ygoLoaded=true;
   filterYgo(false,ygoPendingKey);ygoPendingKey=null;
   $("ygoStatus").textContent="";
 }catch(e){$("ygoStatus").textContent="Could not load Yu-Gi-Oh! database.";}
}
function sortYgo(arr){
 arr.sort((a,b)=>{
   const A=a.card,B=b.card;
   if(ygoSort==="alpha"){
     const n=A.name.localeCompare(B.name);
     if(n)return n;
   }else{
     const da=A.misc_info?.[0]?.tcg_date||"9999-12-31";
     const db=B.misc_info?.[0]?.tcg_date||"9999-12-31";
     if(da!==db)return da.localeCompare(db);
     const n=A.name.localeCompare(B.name);
     if(n)return n;
   }
   if(A.id!==B.id)return A.id-B.id;
   return a.artIndex-b.artIndex;
 });
 return arr;
}

function ygoSubtypeOf(c){
 const kind=ygoKind(c),t=String(c.type||"").toLowerCase(),r=String(c.race||"").toUpperCase();
 if(kind==="MONSTER"){
   if(t.includes("link"))return "LINK";
   if(t.includes("pendulum"))return "PENDULUM";
   if(t.includes("xyz"))return "XYZ";
   if(t.includes("synchro"))return "SYNCHRO";
   if(t.includes("fusion"))return "FUSION";
   if(t.includes("ritual"))return "RITUAL";
   if(t.includes("token"))return "TOKEN";
   if(t==="normal monster"||t==="normal tuner monster")return "NORMAL";
   return "EFFECT";
 }
 if(kind==="SPELL"){
   if(r==="QUICK-PLAY")return "QUICK-PLAY";if(r==="CONTINUOUS")return "CONTINUOUS";
   if(r==="EQUIP")return "EQUIP";if(r==="FIELD")return "FIELD";if(r==="RITUAL")return "RITUAL";return "NORMAL";
 }
 if(kind==="TRAP"){if(r==="CONTINUOUS")return "CONTINUOUS";if(r==="COUNTER")return "COUNTER";return "NORMAL";}
 return "OTHER";
}
function updateYgoSubtypeOptions(){
 const cat=$("ygoCategory").value,sel=$("ygoSubtype"),old=sel.value; let opts=["ALL"];
 if(cat==="MONSTER")opts.push("NORMAL","EFFECT","RITUAL","FUSION","SYNCHRO","XYZ","PENDULUM","LINK","TOKEN");
 else if(cat==="SPELL")opts.push("NORMAL","QUICK-PLAY","CONTINUOUS","EQUIP","FIELD","RITUAL");
 else if(cat==="TRAP")opts.push("NORMAL","CONTINUOUS","COUNTER");
 sel.innerHTML=opts.map(x=>`<option value="${x}">${x}</option>`).join("");
 sel.disabled=cat==="ALL"; sel.value=opts.includes(old)?old:"ALL";
}

function filterYgo(reset=false,preserveKey=null){
 const cat=$("ygoCategory").value;
 ygoEntries=makeYgoEntries();
 ygoFiltered=sortYgo(ygoEntries.filter(e=>(cat==="ALL"||ygoKind(e.card)===cat)&&($("ygoSubtype").value==="ALL"||ygoSubtypeOf(e.card)===$("ygoSubtype").value)));
 if(reset)ygoIndex=0;
 if(preserveKey){
   const x=ygoFiltered.findIndex(e=>`${e.card.id}:${e.artIndex}`===preserveKey);
   if(x>=0)ygoIndex=x;
   else{
     const id=preserveKey.split(":")[0];
     const y=ygoFiltered.findIndex(e=>String(e.card.id)===id);
     ygoIndex=y>=0?y:0;
   }
 }
 ygoIndex=Math.min(ygoIndex,Math.max(0,ygoFiltered.length-1));
 renderYgo();
}
function fitYgoName(){
 const el=$("ygoName");
 let size=32;
 el.style.fontSize=size+"px";
 while(el.scrollWidth>el.clientWidth && size>15){
   size--;
   el.style.fontSize=size+"px";
 }
}

function ygoDexLabelSafe(card,artIndex){
 if(!card||!Array.isArray(ygoCards)||!ygoCards.length)return "";
 const kind=ygoKind(card),sub=ygoSubtypeOf(card);
 const series={
   MONSTER:{NORMAL:"1",EFFECT:"2",RITUAL:"3",FUSION:"4",SYNCHRO:"5",XYZ:"6",PENDULUM:"7",LINK:"8",TOKEN:"9"},
   SPELL:{NORMAL:"10","QUICK-PLAY":"11",CONTINUOUS:"12",EQUIP:"13",FIELD:"14",RITUAL:"15"},
   TRAP:{NORMAL:"16",CONTINUOUS:"17",COUNTER:"18"}
 };
 const prefix=(series[kind]&&series[kind][sub])||"99";
 const master=ygoCards
   .filter(c=>ygoKind(c)===kind&&ygoSubtypeOf(c)===sub&&(c.card_images||[]).length)
   .map(c=>({card:c,artIndex:0,isAlt:false}));
 sortYgo(master);
 const idx=master.findIndex(e=>e.card.id===card.id)+1;
 if(idx<1)return "";
 const base=prefix+"-"+String(idx).padStart(4,"0");
 return artIndex>0?base+"."+artIndex:base;
}

function renderYgo(){
 if(!ygoFiltered.length)return;
 const e=ygoFiltered[ygoIndex],c=e.card,im=(c.card_images||[])[e.artIndex];
 const code=firstSetCode(c);
 whereState.ygo={cat:$("ygoCategory").value,sub:$("ygoSubtype").value,sort:ygoSort,mode:ygoMode,alt:ygoAltArts,key:`${c.id}:${e.artIndex}`};saveWhere();
 $("ygoNumber").textContent=ygoDexLabelSafe(c,e.artIndex);
 $("ygoName").textContent=c.name;
 fitYgoName();
 $("ygoImage").src=im?(ygoMode==="art"?im.image_url_cropped:im.image_url):"";
 const date=c.misc_info?.[0]?.tcg_date||"Release unknown";
 $("ygoJumpInput").value=ygoIndex+1;$("ygoJumpInput").max=ygoFiltered.length;$("ygoCount").textContent=ygoFiltered.length;
 $("ygoStatus").textContent=`${firstSetName(c)} • ${date}`;
 $("ygoArtworkRow").style.display="none";
}
function ygoMove(d){if(!ygoFiltered.length)return;ygoIndex=(ygoIndex+d+ygoFiltered.length)%ygoFiltered.length;renderYgo();}
function setYgoMode(mode){
 ygoMode=mode;$("ygoCardMode").classList.toggle("on",mode==="card");$("ygoArtMode").classList.toggle("on",mode==="art");renderYgo();
}
function setYgoSort(mode){
 const key=currentYgoKey();ygoSort=mode;
 $("ygoReleaseSort").classList.toggle("on",mode==="release");
 $("ygoAlphaSort").classList.toggle("on",mode==="alpha");
 filterYgo(false,key);
}
function toggleYgoAlt(){
 const key=currentYgoKey();ygoAltArts=!ygoAltArts;
 $("ygoAltArts").classList.toggle("on",ygoAltArts);
 $("ygoAltArts").textContent=`ALT ARTS: ${ygoAltArts?"ON":"OFF"}`;
 filterYgo(false,key);
}
function ygoSuggestions(){
 const q=$("ygoSearch").value.trim().toLowerCase(),box=$("ygoSuggestions");
 if(!q){box.classList.remove("show");box.innerHTML="";return}
 const results=ygoCards.filter(c=>c.name.toLowerCase().includes(q)||(c.card_sets||[]).some(x=>(x.set_code||"").toLowerCase().includes(q))).slice(0,40);
 box.innerHTML=results.length?results.map((c,j)=>`<div class="suggestion" data-j="${j}"><b>${c.name}</b><span>${firstSetCode(c)} • ${c.type}</span></div>`).join(""):'<div class="suggestion"><span>No matches</span></div>';
 box.classList.add("show");
 [...box.querySelectorAll("[data-j]")].forEach(el=>el.onclick=()=>{
   const c=results[Number(el.dataset.j)];
   $("ygoCategory").value=ygoKind(c);filterYgo(true);
   const x=ygoFiltered.findIndex(e=>e.card.id===c.id&&e.artIndex===0);if(x>=0)ygoIndex=x;
   $("ygoSearch").value=c.name;box.classList.remove("show");renderYgo();
 });
}

function readVia(make,url){

   .then(t=>{

// Puts each Beyblade's bit chip and parts right after it.
const BEY_PART_ORDER=["Bit Chip","Bit Protector","Attack Ring","Weight Disk","Spin Gear","Support Part","Blade Base","Running Core","Misc. Part"];
const BEY_SHOW_ALSO={"Bit Protector":"Bit Chip","Running Core":"Blade Base"}; // HMS part types share a checkbox
function beyPartsOf(b){return b.hmsParts||(b.page&&beyParts?beyParts[beyKey(b)]:null)||[];}
function withParts(list,show){
 const typeRank=t=>{const i=BEY_PART_ORDER.indexOf(t);return i<0?99:i;};
 const showBeys=show.has("BEY");
 // how many Beyblades use each part (for the "used by" line)
 const usedBy={};
 for(const b of beyCatalog){if(!b.page)continue;for(const pt of beyPartsOf(b))(usedBy[pt.key]=usedBy[pt.key]||[]).push(b);}
 const out=[],seenPart=new Set();
 for(const b of list){
   if(showBeys)out.push(b);
   if(b.chipId&&show.has("Bit Chip")&&(showBeys||!seenPart.has("chip:"+b.chipId))&&(seenPart.add("chip:"+b.chipId),true))
     out.push({isPart:true,isChip:true,name:b.name,number:"Bit Chip",partKey:beyKey(b),chipId:b.chipId,parent:b,
       users:beyCatalog.filter(x=>x.chipId===b.chipId).length,
       page:b.page,group:b.group,family:b.family,anime:b.anime,season:b.season,order:b.order});
   let parts=beyPartsOf(b).map((pt,i)=>({...pt,i})).filter(pt=>show.has(pt.type)||show.has(BEY_SHOW_ALSO[pt.type]));
   if(!showBeys)parts=parts.filter(pt=>!seenPart.has(pt.key)); // without Beyblades, list each part once
   parts.sort((x,y)=>typeRank(x.type)-typeRank(y.type)||x.i-y.i);
   const total={};parts.forEach(pt=>total[pt.type]=(total[pt.type]||0)+1);
   const seen={};
   parts.forEach(pt=>{seenPart.add(pt.key);seen[pt.type]=(seen[pt.type]||0)+1;
     out.push({isPart:true,name:pt.name,number:pt.type,partKey:pt.key,parent:b,noPhoto:pt.photo===false,photoPath:pt.photoPath,
       users:(usedBy[pt.key]||[]).length,
       partOf:showBeys&&total[pt.type]>1?`${seen[pt.type]} of ${total[pt.type]}`:"",
       page:pt.page||"https://www.plasticsdb.com/parts/"+pt.path,group:b.group,family:b.family,anime:b.anime,season:b.season,order:b.order});});
 }
 return out;
}

// full artwork from the wiki (vanguard/renders.json + vgart/, made by the "Grab Vanguard full artwork" job)
let vgRenders=null,vgRendersLoading=null;
function vgNorm(n){return n.replace(/’/g,"'").replace(/\s*\([^)]*\)\s*$/,"").normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");}
function loadVgRenders(){
 if(vgRendersLoading)return vgRendersLoading;
 const repo=BEY_GITHUB_USER+"/"+BEY_GITHUB_REPO;
 return vgRendersLoading=(async()=>{
   for(const u of ["https://cdn.jsdelivr.net/gh/"+repo+"@main/vanguard/renders.json","https://raw.githubusercontent.com/"+repo+"/main/vanguard/renders.json"]){
     try{const r=await fetch(u);if(r.ok){vgRenders=await r.json();break;}}catch(e){}}
   if(vgRenders&&$("vgView").style.display!=="none"&&vgFiltered.length)renderVg();
   return vgRenders;
 })();
}
// the render for a card: prefer the picture whose wiki file name mentions the card's set (e.g. DZ-BT06), else the first
function vgRenderFor(c){
 if(!vgRenders||!vgRenders.map)return null;
 const list=vgRenders.map[vgNorm(c.name)];if(!list||!list.length)return null;
 const set=c.no.split("/")[0].toLowerCase().replace(/[^a-z0-9]/g,"");
 const pick=(set&&list.find(x=>x[1].toLowerCase().replace(/[^a-z0-9]/g,"").includes(set)))||list[0];
 const repo=BEY_GITHUB_USER+"/"+BEY_GITHUB_REPO,p=vgRenders.base+encodeURIComponent(pick[0]);
 return ["https://cdn.jsdelivr.net/gh/"+repo+"@main/"+p,"https://raw.githubusercontent.com/"+repo+"/main/"+p];
}
function vgModeFor(c){
 if(vgShow.has("art")&&vgRenderFor(c))return "art";
 if(vgShow.has("crop"))return "crop";
 if(vgShow.has("card"))return "card";
 return "crop"; // only Artwork ticked and there's no render: show the crop
}
function vgSrcFor(c){const m=vgModeFor(c);return m==="art"?vgRenderFor(c)[0]:c.img;}
function loadVg(){
 if(vgData)return Promise.resolve(vgData);
 if(vgLoading)return vgLoading;
 $("vgStatus").textContent="Loading the Vanguard card list…";
 const repo=BEY_GITHUB_USER+"/"+BEY_GITHUB_REPO;
 const urls=["https://cdn.jsdelivr.net/gh/"+repo+"@main/vanguard/cards.json","https://raw.githubusercontent.com/"+repo+"/main/vanguard/cards.json"];
 return vgLoading=(async()=>{
   for(const u of urls){try{const r=await fetch(u);if(r.ok){vgData=await r.json();break;}}catch(e){}}
   if(!vgData){$("vgStatus").textContent="Couldn't load the Vanguard card list. Tap to try again.";vgLoading=null;throw new Error("vg");}
   const P=vgData.prefix,ER={O:0,G:1,V:2,D:3,DZ:4};
   vgAll=vgData.cards.map((c,k)=>({no:c[0],name:c[1],kind:c[2],clan:c[3],grade:c[4],power:c[5],shield:c[6],
     img:/^https?:/.test(c[7])?c[7]:P+c[7],set:vgData.sets[c[8]],era:c[9],k}));
   // release order: era by era (Original → G → V → D → DivineZ), then set by set
   vgAll.sort((a,b)=>ER[a.era]-ER[b.era]||a.set.id-b.set.id||a.k-b.k);vgAll.forEach((c,k)=>c.order=k);
   // first printing of each card name (alt arts / reprints are hidden unless ALT ARTS is on)
   const seen=new Set();vgAll.forEach(c=>{const key=c.name.toLowerCase();c.firstPrint=!seen.has(key);seen.add(key);});
   vgFillClans();$("vgStatus").textContent="";return vgData;
 })();
}
function vgFillClans(){
 const era=$("vgEra").value,cur=vgPendingClan||$("vgClan").value,count={};vgPendingClan=null;
 vgAll.forEach(c=>{if(era!=="ALL"&&c.era!==era)return;c.clan.split("/").forEach(g=>{if(g)count[g]=(count[g]||0)+1;});});
 const names=Object.keys(count).sort((a,b)=>count[b]-count[a]);
 $("vgClan").innerHTML='<option value="ALL">ALL</option>'+names.map(n=>`<option value="${n.replace(/"/g,"&quot;")}">${n.toUpperCase()}</option>`).join("");
 if(names.includes(cur))$("vgClan").value=cur;
}
function vgKindOk(c,k){
 if(k==="ALL")return true;
 if(k==="ORDER")return /Order/.test(c.kind);
 if(k==="OTHER")return !/Unit|Order/.test(c.kind);
 return c.kind===k;
}
function filterVg(){
 if(!vgData)return;
 vgPage=0;
 const prevK=vgFiltered[vgIndex]?vgFiltered[vgIndex].k:null,prevI=vgIndex;
 const era=$("vgEra").value,clan=$("vgClan").value,kind=$("vgKind").value,grade=$("vgGrade").value,sort=$("vgSort").value;
 const q=$("vgSearch").value.trim().toLowerCase();
 vgFiltered=vgAll.filter(c=>(vgAltOn||q||c.firstPrint)&&(era==="ALL"||c.era===era)&&(clan==="ALL"||c.clan.split("/").includes(clan))
   &&vgKindOk(c,kind)&&(grade==="ALL"||(grade==="5+"?(+c.grade>=5):c.grade===grade))
   &&(!q||c.name.toLowerCase().includes(q)||c.no.toLowerCase().includes(q)||(c.set.code||"").toLowerCase().includes(q)));
 if(sort==="alpha")vgFiltered.sort((a,b)=>a.name.localeCompare(b.name)||a.order-b.order);
 else if(sort==="newest")vgFiltered.sort((a,b)=>b.order-a.order);
 // keep your place: the card you were on when the app closed (first load), else the same card if it's still listed
 let x=-1;
 if(vgPendingK!=null){x=vgFiltered.findIndex(c=>c.k===vgPendingK);vgPendingK=null;}
 if(x<0&&prevK!=null)x=vgFiltered.findIndex(c=>c.k===prevK);
 vgIndex=x>=0?x:Math.min(prevI,Math.max(0,vgFiltered.length-1));
 renderVg();
}
function vgFitName(){
 const el=$("vgName"),avail=el.clientWidth;if(!avail)return;el.style.fontSize="34px";
 const sp=document.createElement("span");sp.textContent=el.textContent;sp.style.whiteSpace="nowrap";el.textContent="";el.appendChild(sp);
 const need=sp.getBoundingClientRect().width;el.textContent=sp.textContent;
 if(need>avail)el.style.fontSize=Math.max(14,Math.floor(34*avail/need*0.98))+"px";
}
function vgPlaceArt(){
 const img=$("vgImage"),box=$("vgArtBox"),c=vgFiltered[vgIndex];
 if(vgShown!=="crop"||!c||!img.naturalWidth){box.classList.remove("cropped");box.style.aspectRatio="";img.style.cssText="";return;}
 const [x0,y0,x1,y1]=vgArtBox(c);
 box.classList.add("cropped");
 const W=box.clientWidth,aw=(x1-x0)*img.naturalWidth,ah=(y1-y0)*img.naturalHeight;
 box.style.aspectRatio=(aw/ah).toFixed(3);
 const s=W/aw;img.style.width=(img.naturalWidth*s)+"px";img.style.height=(img.naturalHeight*s)+"px";
 img.style.left=(-x0*img.naturalWidth*s)+"px";img.style.top=(-y0*img.naturalHeight*s)+"px";
}
let vgToken=0;
let vgPage=0; // 0 = the card, 1 = the artwork (when Card and Artwork are both ticked)
function vgComboFor(c){return !!(c&&vgShow.has("card")&&vgShow.has("art")&&(vgRenderFor(c)||[]).length);}
function renderVg(){ vgSavePrefs();
 const n=vgFiltered.length;$("vgCount").textContent=n;$("vgJumpInput").max=n;
 if(!n){$("vgNumber").textContent="";$("vgName").textContent="No cards found";$("vgImage").removeAttribute("src");$("vgInfo").textContent="";return;}
 const c=vgFiltered[vgIndex],tok=++vgToken;
 $("vgJumpInput").value=vgIndex+1;
 $("vgNumber").textContent=c.no+(c.set.code&&!c.no.toUpperCase().startsWith(c.set.code.toUpperCase())?"  •  "+c.set.code:"");
 $("vgName").textContent=c.name;vgFitName();
 const bits=[];
 if(c.grade&&c.grade!=="-")bits.push("Grade "+c.grade);
 if(c.clan)bits.push(c.clan.replace(/\//g," / "));
 if(c.kind)bits.push(c.kind);
 if(c.power&&c.power!=="-")bits.push("Power "+c.power);
 if(c.shield&&c.shield!=="-")bits.push("Shield "+c.shield);
 $("vgInfo").innerHTML=bits.join(" • ")+"<br>"+VG_ERA[c.era]+" • "+(c.set.name||"").replace(/</g,"&lt;");
 const img=$("vgImage"),box=$("vgArtBox");box.classList.remove("cropped");box.style.aspectRatio="";img.style.cssText="";img.style.visibility="hidden";
 $("vgStatus").textContent="";
 const render=vgRenderFor(c);let mode=vgModeFor(c),tries=mode==="art"?render.slice():[c.img];
 vgShown=mode;
 // Card AND Artwork ticked: the card on one page, the artwork on the next
 const combo=vgComboFor(c);
 if(!combo)vgPage=0;
 if(combo){mode=vgPage===1?"art":"card";vgShown=mode;tries=mode==="art"?render.slice():[c.img];}
 const note=()=>{
   let t="";
   if(combo)t=vgPage===1?"Artwork — swipe back for the card":"Card — swipe for the artwork";
   else if(!render&&vgShow.has("art"))t="No full render available yet — showing the "+(vgShown==="crop"?"crop":"card");
   else if(!render&&vgShown==="crop")t="No full render available yet";
   else if(render&&vgShown!=="art")t="Full render available — tick Artwork to see it";
   $("vgNote").textContent=t;
 };
 note();
 img.onload=()=>{if(tok!==vgToken)return;vgPlaceArt();img.style.visibility="visible";};
 img.onerror=()=>{
   if(tok!==vgToken)return;
   if(tries.length){img.src=tries.shift();return;}
   if(vgShown==="art"){ // render didn't load: fall back to the crop/card
     vgShown=vgShow.has("card")&&!vgShow.has("crop")?"card":"crop";$("vgNote").textContent="Full render didn't load — showing the "+vgShown;img.src=c.img;return;}
   img.style.visibility="hidden";$("vgStatus").textContent="Picture didn't load. Tap here to try again.";};
 img.src=tries.shift();
 for(const d of [1,2,-1]){const nb=vgFiltered[(vgIndex+d+n)%n];if(nb)new Image().src=vgSrcFor(nb);}
}
function vgMove(d){if(!vgFiltered.length)return;
 // card and artwork both ticked: move between the card and its artwork first
 const cur=vgFiltered[vgIndex];
 if(vgComboFor(cur)){const np=vgPage+d;if(np>=0&&np<=1){vgPage=np;renderVg();return;}}
 vgIndex=(vgIndex+d+vgFiltered.length)%vgFiltered.length;
 // going back lands on the last page (the artwork) of the card before
 vgPage=(d<0&&vgComboFor(vgFiltered[vgIndex]))?1:0;
 renderVg();}
function vgPaintControls(){
 document.querySelectorAll("#vgShow button").forEach(b=>b.setAttribute("aria-pressed",vgShow.has(b.dataset.t)?"true":"false"));
 $("vgAlt").textContent="ALT ARTS: "+(vgAltOn?"ON":"OFF");$("vgAlt").classList.toggle("on",vgAltOn);
}
function openVg(){
 vgPaintControls();
 loadVgRenders();
 loadVg().then(()=>{if(!vgFiltered.length)filterVg();else renderVg();}).catch(()=>{});
}
try{const s=JSON.parse(localStorage.getItem("swipedex_vg_prefs")||"{}");if(s.era)$("vgEra").value=s.era;if(s.sort)$("vgSort").value=s.sort;if(s.kind)$("vgKind").value=s.kind;if(s.grade)$("vgGrade").value=s.grade;if(s.q)$("vgSearch").value=s.q;}catch(e){}
$("vgEra").onchange=()=>{vgFillClans();vgSavePrefs();filterVg();};
["vgClan","vgKind","vgGrade","vgSort"].forEach(id=>$(id).onchange=()=>{vgSavePrefs();filterVg();});
document.querySelectorAll("#vgShow button").forEach(btn=>btn.onclick=()=>{
 const t=btn.dataset.t;
 if(vgShow.has(t)){if(vgShow.size===1)return;vgShow.delete(t);}else vgShow.add(t); // keep at least one ticked
 vgPaintControls();vgSavePrefs();if(vgFiltered.length)renderVg();
});
$("vgAlt").onclick=()=>{vgAltOn=!vgAltOn;vgPaintControls();vgSavePrefs();filterVg();};
let vgSearchTimer=0;$("vgSearch").addEventListener("input",()=>{clearTimeout(vgSearchTimer);vgSearchTimer=setTimeout(filterVg,250);});
$("vgPrev").onclick=()=>vgMove(-1);$("vgNext").onclick=()=>vgMove(1);
$("vgStatus").onclick=()=>{if(/try again/.test($("vgStatus").textContent)){if(!vgData)openVg();else renderVg();}};
function jumpVg(){if(!vgFiltered.length)return;let n=parseInt($("vgJumpInput").value,10);if(!Number.isFinite(n))n=vgIndex+1;vgIndex=Math.max(1,Math.min(vgFiltered.length,n))-1;renderVg();}
$("vgJumpGo").onclick=jumpVg;$("vgJumpInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();jumpVg();e.target.blur();}});
window.addEventListener("resize",()=>{if($("vgView").style.display!=="none"){vgFitName();vgPlaceArt();}});
let vsx=0,vsy=0;
$("vgCard").addEventListener("touchstart",e=>{vsx=e.touches[0].clientX;vsy=e.touches[0].clientY},{passive:true});
$("vgCard").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-vsx,dy=e.changedTouches[0].clientY-vsy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))vgMove(dx<0?1:-1)},{passive:true});
$("vgDownload").onclick=async()=>{
 const c=vgFiltered[vgIndex];if(!c)return;
 if(!window.Android){window.open($("vgImage").src,"_blank");return;} // in a web browser: open the picture so it can be saved
 const base=(c.no+" - "+c.name).replace(/[\\/:*?"<>|]/g,"_");
 // full render: save it as it is
 if(vgShown==="art"){const r=vgRenderFor(c);if(r){Android.downloadImage(r[0],base+" (artwork).jpg");return;}}
 // crop: cut the artwork out of the card picture (falls back to the full card)
 if(vgShown==="crop"){
   try{
     const blob=await (await fetch(c.img)).blob(),bmp=await createImageBitmap(blob);
     const [x0,y0,x1,y1]=vgArtBox(c),sx=x0*bmp.width,sy=y0*bmp.height,sw=(x1-x0)*bmp.width,sh=(y1-y0)*bmp.height;
     const cv=document.createElement("canvas");cv.width=Math.round(sw);cv.height=Math.round(sh);
     cv.getContext("2d").drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);
     if(Android.saveImageBase64){Android.saveImageBase64(cv.toDataURL("image/png").split(",")[1],base+" (art).png");return;}
   }catch(e){}
 }
 Android.downloadImage(c.img,base+".png");
};
// ---------- game tabs ----------
const GAME_TABS=[["pokemonTab","pokemonView"],["ygoTab","ygoView"],["beyTab","beyView"],["vgTab","vgView"]];
function showGame(tab){
 whereState.tab=tab;saveWhere();
 GAME_TABS.forEach(([t,v])=>{$(t).classList.toggle("active",t===tab);$(v).style.display=t===tab?"block":"none";});
 if(tab==="ygoTab")loadYgo();else if(tab==="beyTab")renderBey();else if(tab==="vgTab")openVg();
}
GAME_TABS.forEach(([t])=>$(t).onclick=()=>showGame(t));
$("ygoCategory").onchange=()=>{updateYgoSubtypeOptions();filterYgo(false,currentYgoKey());};
$("ygoCardMode").onclick=()=>setYgoMode("card");$("ygoArtMode").onclick=()=>setYgoMode("art");
$("ygoReleaseSort").onclick=()=>setYgoSort("release");$("ygoAlphaSort").onclick=()=>setYgoSort("alpha");$("ygoAltArts").onclick=toggleYgoAlt;
$("ygoPrev").onclick=()=>ygoMove(-1);$("ygoNext").onclick=()=>ygoMove(1);
$("ygoSearch").addEventListener("input",ygoSuggestions);$("ygoSearch").addEventListener("focus",ygoSuggestions);
$("ygoDownload").onclick=()=>{
 const e=ygoFiltered[ygoIndex],c=e.card,im=(c.card_images||[])[e.artIndex];if(!im)return;
 const url=ygoMode==="art"?im.image_url_cropped:im.image_url;
 const dexNumber=ygoDexLabelSafe(c,e.artIndex);
 const filename=`${dexNumber} - ${c.name}.png`;
 if(window.Android&&Android.downloadImage)Android.downloadImage(url,filename);
 else $("ygoStatus").textContent="Native downloader unavailable.";
};
let ysx=0,ysy=0;
$("ygoCard").addEventListener("touchstart",e=>{ysx=e.touches[0].clientX;ysy=e.touches[0].clientY},{passive:true});
$("ygoCard").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-ysx,dy=e.changedTouches[0].clientY-ysy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))ygoMove(dx<0?1:-1)},{passive:true});


function jumpPokemon(){if(!pokemon.length)return;let n=parseInt($("jumpInput").value,10);if(!Number.isFinite(n))n=i+1;n=Math.max(1,Math.min(pokemon.length,n));i=n-1;render();}
$("jumpGo").onclick=jumpPokemon;
$("jumpInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();jumpPokemon();e.target.blur();}});
function jumpYgo(){if(!ygoFiltered.length)return;let n=parseInt($("ygoJumpInput").value,10);if(!Number.isFinite(n))n=ygoIndex+1;n=Math.max(1,Math.min(ygoFiltered.length,n));ygoIndex=n-1;renderYgo();}
$("ygoJumpGo").onclick=jumpYgo;
$("ygoJumpInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();jumpYgo();e.target.blur();}});




$("ygoViewSelect").addEventListener("change",e=>{
  (e.target.value==="art"?$("ygoArtMode"):$("ygoCardMode")).click();
});
$("ygoSortSelect").addEventListener("change",e=>{
  (e.target.value==="alpha"?$("ygoAlphaSort"):$("ygoReleaseSort")).click();
});

$("ygoSubtype").addEventListener("change",()=>filterYgo(false,currentYgoKey()));
$("ygoCategory").addEventListener("change",()=>{updateYgoSubtypeOptions();});
updateYgoSubtypeOptions();

// ---------- come back to where you left off ----------
(function restoreWhere(){
 try{
   const g=whereState.poke;
   if(g){
     if(showForms){$("formsToggle").classList.add("on");$("formsToggle").textContent="ALTERNATE FORMS: ON";}
     if(showShiny){$("shinyToggle").classList.add("on");$("shinyToggle").textContent="SHINY: ON";}
     if([...$("genSelect").options].some(o=>o.value===generation))$("genSelect").value=generation;
   }
   const y=whereState.ygo;
   if(y){
     ygoSort=y.sort==="alpha"?"alpha":"release";
     ygoMode=y.mode==="art"?"art":"card";
     ygoAltArts=!!y.alt;
     $("ygoReleaseSort").classList.toggle("on",ygoSort==="release");
     $("ygoAlphaSort").classList.toggle("on",ygoSort==="alpha");
     $("ygoCardMode").classList.toggle("on",ygoMode==="card");
     $("ygoArtMode").classList.toggle("on",ygoMode==="art");
     $("ygoAltArts").classList.toggle("on",ygoAltArts);
     $("ygoAltArts").textContent=`ALT ARTS: ${ygoAltArts?"ON":"OFF"}`;
     if([...$("ygoCategory").options].some(o=>o.value===y.cat))$("ygoCategory").value=y.cat;
     updateYgoSubtypeOptions();
     if([...$("ygoSubtype").options].some(o=>o.value===y.sub))$("ygoSubtype").value=y.sub;
   }
   // a link ending in #vanguard / #beyblade / #yugioh / #pokemon opens that tab
   const HASH_TABS={"#pokemon":"pokemonTab","#yugioh":"ygoTab","#beyblade":"beyTab","#vanguard":"vgTab"};
   const t=HASH_TABS[(location.hash||"").toLowerCase()]||whereState.tab;
   if(t&&t!=="pokemonTab"&&GAME_TABS.some(([id])=>id===t))showGame(t);
 }catch(e){}
})();

loadCanonical();

</script>
